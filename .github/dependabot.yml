# 의존성 자동 갱신. 흐름이 astro → release/* → main 이라 PR 은 `astro`(작업 브랜치)로 보낸다.
# main 으로 곧장 보내면 릴리스 도구를 거치지 않고, 보호 규칙 때문에 필수 검사를 모두 통과해야 하며 `astro` 와 갈라진다.
# `astro` 로 받으면 ci.yml(브랜치 제한 없는 pull_request)이 같은 검사를 돌리고, 병합된 갱신은 다음 릴리스 PR 에 실려 간다.
# 이 파일은 기본 브랜치(main)에 있어야 읽힌다: 릴리스로 main 에 들어간 뒤부터 동작한다.
version: 2

updates:
  # 루트와 워크스페이스 tools/astro-check 를 한 항목으로 본다: 같은 package-lock.json 을 공유하므로 한 그룹, 한 PR 이다.
  - package-ecosystem: npm
    directories:
      - /
      - /tools/astro-check
    target-branch: astro
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # 주 버전은 그룹에 넣지 않아 패키지마다 PR 하나씩 나온다. tools/astro-check 의 typescript 는 6.0.3 에 고정돼 있어
    # (루트의 TypeScript 7 옆에서 쓰려고) 7 로 올리는 PR 은 CI 가 걸러 낸다.

  - package-ecosystem: github-actions
    directory: /
    target-branch: astro
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
