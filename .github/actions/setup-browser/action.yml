# verify 와 selftest 가 같이 쓰는 준비: Node, npm ci, playwright 브라우저와 시스템 의존성.
# 호출하는 job 이 먼저 actions/checkout 을 돌려야 한다(로컬 액션은 체크아웃된 파일에서 읽힌다).
name: Set up Node and Playwright
description: Node, npm ci, Chromium for Playwright

inputs:
  read-only-cache:
    description: 브라우저 캐시를 읽기만 한다(배포 워크플로는 캐시를 쓰지 않는다. browsers.yml 이 main 범위의 캐시를 채운다)
    default: "false"

runs:
  using: composite
  steps:
    # 배포 워크플로가 부르므로 패키지 매니저 캐시를 쓰지 않는다(setup-node 문서의 권고).
    - uses: actions/setup-node@v7
      with:
        node-version-file: mise.toml
        package-manager-cache: false
    - run: npm ci
      shell: bash
    # 브라우저는 playwright 버전마다 캐시한다. 키가 버전이라 낡은 브라우저가 쓰일 수 없다.
    - id: playwright
      run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      shell: bash
    - if: inputs.read-only-cache != 'true'
      id: browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - if: inputs.read-only-cache == 'true'
      id: browsers-restore
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - if: steps.browsers.outputs.cache-hit == 'true' || steps.browsers-restore.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium
      shell: bash
    - if: steps.browsers.outputs.cache-hit != 'true' && steps.browsers-restore.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium
      shell: bash
