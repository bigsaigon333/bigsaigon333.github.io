name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 게시 권한(pages, id-token)은 deploy job 에만 준다. 나머지 job 은 npm ci 로 의존성의 설치 스크립트를 돌린다(W9).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  # 자기 검사는 검사기를 시험할 뿐 배포물을 만들지 않는다. push 된 커밋으로 merge 된 PR 의 head 가 같은 트리이고
  # 그 head 에서 "verify selftest" 가 성공했으면 다시 돌리지 않는다. 그 밖의 경우(직접 push, 수동 실행, 무엇이든
  # 어긋나거나 조회에 실패하면)는 모두 돌린다. verify(배포물을 만든다)는 늘 돈다.
  selftest-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          decide() { echo "selftest: $2"; echo "run=$1" >> "$GITHUB_OUTPUT"; exit 0; }
          trap 'decide true "runs: a lookup failed"' ERR
          set -o pipefail
          [ "$EVENT" = push ] || decide true "runs: $EVENT is not a push"
          prs=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$SHA\")]")
          [ "$(jq length <<<"$prs")" = 1 ] || decide true "runs: no single pull request merged as $SHA"
          number=$(jq -r '.[0].number' <<<"$prs")
          head=$(jq -r '.[0].head.sha' <<<"$prs")
          tree=$(gh api "repos/$REPO/commits/$SHA" --jq .commit.tree.sha)
          head_tree=$(gh api "repos/$REPO/commits/$head" --jq .commit.tree.sha)
          [ -n "$tree" ] && [ "$tree" = "$head_tree" ] || decide true "runs: tree of #$number head $head ($head_tree) is not the tree of $SHA ($tree)"
          # ci.yml 의 실행이 만든 check run 만 센다: PR 이 더하거나 바꾼 다른 워크플로도 같은 이름의 job 을 만들 수
          # 있다(W9). 그 실행들의 check suite 에 든 "checks / verify selftest" 중, 다시 돌린 것이 있으면 마지막 것을 본다.
          suites=$(gh api --paginate "repos/$REPO/actions/runs?head_sha=$head&event=pull_request&per_page=100" \
            --jq '.workflow_runs[] | select(.path == ".github/workflows/ci.yml") | .check_suite_id' | jq -s -c .)
          latest=$(gh api --paginate "repos/$REPO/commits/$head/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.app.slug == "github-actions" and .name == "checks / verify selftest") | [.check_suite.id, .started_at, .status, (.conclusion // "-"), .html_url] | @tsv' \
            | jq -R -r --argjson suites "$suites" 'split("\t") | select((.[0] | tonumber) as $id | $suites | any(. == $id)) | .[1:] | @tsv' \
            | sort | tail -n 1)
          [ -n "$latest" ] || decide true "runs: #$number head $head has no \"checks / verify selftest\" check run from ci.yml"
          IFS=$'\t' read -r _ status conclusion url <<<"$latest"
          [ "$status/$conclusion" = completed/success ] || decide true "runs: \"verify selftest\" of #$number head $head is $status/$conclusion ($url)"
          decide false "skipped: #$number head $head has the tree of $SHA and passed \"verify selftest\" ($url)"

  # 기준선은 지금 운영 중인 것: github-pages 환경에서 마지막으로 성공한(아직 inactive 가 되지 않은) 배포의 커밋이다.
  # 직전 커밋(push 전의 main)은 배포가 실패했거나 대기 중에 밀려났으면 한 번도 운영된 적이 없고, 수동 실행의
  # 지금 커밋은 자기 자신과 비교하게 된다(W9). 조회가 실패하거나 성공한 배포가 없을 때만 예전 규칙으로 돌아가고,
  # 어느 쪽을 썼는지 남긴다.
  baseline:
    runs-on: ubuntu-latest
    permissions:
      deployments: read
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FALLBACK: ${{ github.event_name == 'push' && github.event.before || github.sha }}
        run: |
          use() { echo "baseline: $1 ($2)"; echo "ref=$1" >> "$GITHUB_OUTPUT"; exit 0; }
          trap 'use "$FALLBACK" "fallback: the deployment lookup failed"' ERR
          set -o pipefail
          ids=$(gh api "repos/$REPO/deployments?environment=github-pages&per_page=30" --jq '.[].id')
          for id in $ids; do
            state=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')
            if [ "$state" = success ]; then
              sha=$(gh api "repos/$REPO/deployments/$id" --jq .sha)
              [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || use "$FALLBACK" "fallback: deployment $id has no commit"
              use "$sha" "live: deployment $id"
            fi
          done
          use "$FALLBACK" "fallback: no successful github-pages deployment among the last 30"

  # main 에 Pull Request 를 거치지 않고 들어온 커밋도 같은 검사를 통과해야 배포된다.
  checks:
    needs: [selftest-plan, baseline]
    uses: ./.github/workflows/checks.yml
    with:
      pages-artifact: true
      selftest: ${{ needs.selftest-plan.outputs.run != 'false' }}
      baseline-ref: ${{ needs.baseline.outputs.ref }}

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # 배포 뒤 실제 주소가 200 으로, 리다이렉트 없이, 방금 배포한 커밋의 빌드와 같은 내용으로 응답하는지 본다.
  live:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      - run: npm ci
      # 실제 사이트는 방금 배포한 아티팩트(검사를 통과한 그 dist/)와 같아야 한다. 다시 빌드하지 않고 기준선으로 쓴다.
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages
      - run: |
          mkdir -p .verify/baseline
          tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C .verify/baseline
      # CDN 이 새 배포를 내보내기까지 잠깐 걸릴 수 있어 30초 간격으로 다섯 번까지 본다.
      - env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5; do
            npm run verify:live -- --base-url="$BASE_URL" && exit 0
            echo "attempt $attempt failed"
            sleep 30
          done
          exit 1
