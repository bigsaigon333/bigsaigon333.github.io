# 댓글 워커(comments/, npm workspace)의 타입 검사와 시험. 시험은 vitest-pool-workers 와 로컬 D1 로 돈다.
# Pull Request(ci.yml)와 워커 배포(deploy.yml 의 worker-deploy)가 부른다. 사이트 배포의 검사(checks.yml)에는 넣지 않는다:
# workerd 내려받기나 워커 시험이 흔들려도 Pages 배포가 막히지 않게 한다(WB-review).
name: Worker checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  worker:
    name: worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 배포 워크플로가 부르므로 패키지 매니저 캐시를 쓰지 않는다(setup-node 문서의 권고).
      - uses: actions/setup-node@v7
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      - run: npm ci
      - run: npm -w comments run typecheck
      - run: npm -w comments test
